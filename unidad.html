<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidad | Forma I - Derecho Penal</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header>
  <h1>Forma I - Derecho Penal</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="herramientas/flashcards.html">Flashcards</a>
    <a href="herramientas/quiz.html">Quiz</a>
    <a href="herramientas/glosario.html">Glosario</a>
  </nav>
</header>
<main>
  <p class="breadcrumb"><a href="index.html">&larr; Volver a todas las unidades</a></p>
  <div id="contenido-unidad"></div>
  <div class="card">
    <h3>Reforzá lo aprendido</h3>
    <p>
      <a href="herramientas/flashcards.html"><button>Ver flashcards de esta unidad</button></a>
      <a href="herramientas/quiz.html"><button>Hacer el quiz de esta unidad</button></a>
    </p>
  </div>
</main>
<footer>Escuela Judicial - Consejo de la Magistratura del Paraguay</footer>
<script src="assets/js/data.js"></script>
<script>
const id = parseInt(qs('u'));
loadJSON('assets/data/contenido.json').then(data=>{
  const u = data.unidades.find(x=>x.id===id);
  if(!u){ document.getElementById('contenido-unidad').innerHTML = '<p>Unidad no encontrada.</p>'; return; }
  document.getElementById('contenido-unidad').innerHTML = `
    <span class="badge">Unidad ${u.id}</span>
    <h2>${u.titulo}</h2>
    <div class="card">
      <h3>Objetivos de aprendizaje</h3>
      <ul class="objetivo-list">${u.objetivos.map(o=>`<li>${o}</li>`).join('')}</ul>
    </div>
    <div class="card">
      <h3>Contenido de lectura</h3>
      <p>${u.lectura}</p>
    </div>
    <div class="card">
      <h3>Términos clave</h3>
      <ul>${u.terminos.map(t=>`<li><strong>${t.termino}:</strong> ${t.definicion}</li>`).join('')}</ul>
    </div>
  `;
});
</script>
</body>
</html>
